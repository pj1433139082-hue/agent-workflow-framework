name: Framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m agent_workflow doctor
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py

  # 稳定聚合门禁：给分支保护用的单一 context。
  # matrix 的 job 名带参数（test (windows-latest, 3.11) …），直接 require 会在矩阵变动时永久 Pending。
  checks:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate matrix result
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
