name: "✨ Feature Request / 功能建议"
description: "为 agent-workflow-framework 提议新的协作机制、CLI 工具能力或工作流调度特性"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 agent-workflow-framework 提出改进建议！
        在提出新特性前，请确认该特性符合框架定位：通用轻量、纯标准库、与具体业务逻辑解耦。

  - type: textarea
    id: problem
    attributes:
      label: "解决的问题或应用场景 (Problem or Use Case)"
      description: "描述你在使用框架时遇到的痛点，或需要支持的具体协作场景"
      placeholder: "当前在处理复杂断点恢复或多角色协作时，缺少..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "建议的解决方案 (Proposed Solution)"
      description: "清晰描述你期望的特性实现方式、CLI 接口设计或架构扩展方案"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "考虑过的备选方案 (Considered Alternatives)"
      description: "你是否考虑过其他实现方案或目前的临时应对方法"

  - type: textarea
    id: additional-context
    attributes:
      label: "补充信息 (Additional Context)"
      description: "任何有助于理解该提案的参考资料、流程示意图或架构背景"

  - type: checkboxes
    id: contribution-interest
    attributes:
      label: "贡献意愿 (Contribution)"
      options:
        - label: "我愿意针对该提案提交 Pull Request 并参与代码实现"
