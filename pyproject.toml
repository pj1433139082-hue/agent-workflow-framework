[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-framework"
version = "0.1.0"
description = "Domain-neutral agent collaboration with declarative workflows and synthetic examples"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-workflow = "agent_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["agent_workflow*"]

[tool.setuptools.package-data]
agent_workflow = ["packs/*/*.json", "packs/*/*.md"]
